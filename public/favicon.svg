<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />

  <!-- Audio Equalizer Waveform Bars -->
  <line x1="7" y1="30" x2="7" y2="34" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="13" y1="23" x2="13" y2="41" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
  
  <line x1="51" y1="23" x2="51" y2="41" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="57" y1="30" x2="57" y2="34" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Microphone Main Body -->
  <rect x="25" y="15" width="14" height="22" rx="7" fill="url(#micGrad)" filter="url(#glow)" />
  
  <!-- Microphone Outer U-Arc -->
  <path d="M19 30a13 13 0 0 0 26 0" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  
  <!-- Microphone Stand Base -->
  <line x1="32" y1="43" x2="32" y2="50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="24" y1="50" x2="40" y2="50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
</svg>
