<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>

    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <linearGradient id="adminWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="64" height="64" rx="16" fill="url(#adminBgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.5" />

  <!-- Waveform Accent Bars -->
  <line x1="9" y1="26" x2="9" y2="42" stroke="url(#adminWaveGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="55" y1="26" x2="55" y2="42" stroke="url(#adminWaveGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Lock Shackle -->
  <path d="M24 28V19a8 8 0 0 1 16 0v9" fill="none" stroke="url(#shackleGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Lock Main Body -->
  <rect x="18" y="28" width="28" height="22" rx="5" fill="url(#lockBodyGrad)" filter="url(#adminGlow)" />

  <!-- Keyhole -->
  <circle cx="32" cy="37" r="2.5" fill="#ffffff" />
  <line x1="32" y1="39.5" x2="32" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>
